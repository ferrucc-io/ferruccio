<script>
(function () {
  // Track clicks on outbound (external) links
  document.addEventListener("click", function (e) {
    var link = e.target.closest("a[href]");
    if (!link) return;

    var href = link.getAttribute("href");
    if (!href) return;

    try {
      var url = new URL(href, window.location.origin);
      if (url.hostname === window.location.hostname) return;
    } catch (err) {
      return;
    }

    if (typeof pendo !== "undefined" && pendo.track) {
      pendo.track("Outbound Link Clicked", {
        link_url: url.hostname + url.pathname,
        link_text: (link.textContent || "").trim().substring(0, 100),
        page_path: window.location.pathname,
      });
    }
  });

  // Track when a visitor scrolls to the end of a blog post
  var article = document.querySelector("article main, article .nested-copy-line-height");
  if (article) {
    var tracked = false;
    var observer = new IntersectionObserver(
      function (entries) {
        if (tracked) return;
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            tracked = true;
            observer.disconnect();
            if (typeof pendo !== "undefined" && pendo.track) {
              pendo.track("Article Read Complete", {
                article_title: document.title,
                page_path: window.location.pathname,
              });
            }
            break;
          }
        }
      },
      { threshold: 0.5 }
    );

    // Observe the last element inside the article content
    var children = article.children;
    if (children.length > 0) {
      observer.observe(children[children.length - 1]);
    }
  }
})();
</script>
